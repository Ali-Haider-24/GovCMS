name: GovCMS scheduled security audit

on:
  schedule:
    # Temporary test: every 15 minutes throughout the day.
    - cron: '7,22,37,52 * * * *'

  # Allows testing from the GitHub Actions UI.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-audit:
    runs-on: ubuntu-latest

    container:
      image: govcmstesting/ci:latest-php8.3-apache
      options: --user root

    env:
      COMPOSER_NO_SECURITY_BLOCKING: 1

    steps:
      - name: Check out 3.x-develop
        uses: actions/checkout@v6
        with:
          ref: 3.x-develop

      - name: Resolve GovCMS dependencies
        run: >
          composer update
          --profile
          --prefer-dist
          --optimize-autoloader
          --no-scripts

      - name: Run Composer security audit
        run: composer audit --locked
